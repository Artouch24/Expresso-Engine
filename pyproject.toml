[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "poker-tracker"
version = "0.1.0"
description = "Local Winamax Expresso poker tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
poker-tracker = "poker_tracker.cli.commands:main"

[tool.hatch.build.targets.wheel]
packages = ["src/poker_tracker"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
